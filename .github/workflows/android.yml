name: CraftNode Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build CraftNode v1.0.6 APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Install Android SDK packages
        run: |
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Set up Python for project checks
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bundle verified Android ARM64 PHP executable
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/jniLibs/arm64-v8a "$RUNNER_TEMP/php-runtime"
          curl --fail --location --retry 3 "https://github.com/pmmp/PHP-Binaries/releases/download/pm5-php-8.4-latest/PHP-8.4-Android-arm64-PM5.tar.gz" -o "$RUNNER_TEMP/php-runtime.tar.gz"
          echo "d8867966340121f821591b9bb29c80a58ad77abd6cc8e0e44d1cbbb3aaedd70c  $RUNNER_TEMP/php-runtime.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/php-runtime.tar.gz" -C "$RUNNER_TEMP/php-runtime"
          PHP_BIN="$(find "$RUNNER_TEMP/php-runtime" -type f -name php | head -n 1)"
          test -n "$PHP_BIN"
          readelf -h "$PHP_BIN" | grep -q 'AArch64'
          cp "$PHP_BIN" app/src/main/jniLibs/arm64-v8a/libphp.so
          chmod 755 app/src/main/jniLibs/arm64-v8a/libphp.so

      - name: Prepare pinned NovaMine checksum asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets "$RUNNER_TEMP/novamine"
          NOVAMINE_URL="https://raw.githubusercontent.com/Zinkaio/NovaMine/e37d378d35b7ecb46ee5a6b9838a6d8261da2b24/NovaMine.phar"
          curl --fail --location --retry 3 "$NOVAMINE_URL" -o "$RUNNER_TEMP/novamine/NovaMine.phar"
          test "$(stat -c%s "$RUNNER_TEMP/novamine/NovaMine.phar")" -gt 1000000
          sha256sum "$RUNNER_TEMP/novamine/NovaMine.phar" | awk '{print $1}' > app/src/main/assets/novamine.sha256
          test "$(wc -c < app/src/main/assets/novamine.sha256)" -eq 65

      - name: Run Python project safety checks
        run: python tools/validate_project.py

      - name: Run unit tests and build APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug

      - name: Rename versioned APK
        run: cp app/build/outputs/apk/debug/app-debug.apk CraftNode-v1.0.6-debug.apk

      - name: Upload CraftNode v1.0.6 APK
        uses: actions/upload-artifact@v4
        with:
          name: CraftNode-v1.0.6-debug-apk
          path: CraftNode-v1.0.6-debug.apk
          if-no-files-found: error
          retention-days: 30
