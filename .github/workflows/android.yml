name: CraftNode Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build CraftNode v1.0.1 APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Install Android SDK packages
        run: |
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Run unit tests and build APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug

      - name: Rename versioned APK
        run: cp app/build/outputs/apk/debug/app-debug.apk CraftNode-v1.0.1-debug.apk

      - name: Upload CraftNode v1.0.1 APK
        uses: actions/upload-artifact@v4
        with:
          name: CraftNode-v1.0.1-debug-apk
          path: CraftNode-v1.0.1-debug.apk
          if-no-files-found: error
          retention-days: 30
