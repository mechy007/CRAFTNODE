name: CraftNode Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build CraftNode v1.0.23 APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Install Android SDK packages
        run: |
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Set up Python for project checks
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bundle verified Android ARM64 FRP client
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/jniLibs/arm64-v8a "$RUNNER_TEMP/frp-runtime"
          FRP_URL="https://github.com/fatedier/frp/releases/download/v0.71.1/frp_0.71.1_android_arm64.tar.gz"
          curl --fail --location --retry 3 "$FRP_URL" -o "$RUNNER_TEMP/frp-android-arm64.tar.gz"
          echo "9dce8c10e66bdf1a0cff19bf2cd1a3f4f7389fccee8ca0cda57a7a7c0d87af3a  $RUNNER_TEMP/frp-android-arm64.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/frp-android-arm64.tar.gz" -C "$RUNNER_TEMP/frp-runtime"
          FRPC_BIN="$(find "$RUNNER_TEMP/frp-runtime" -type f -name frpc | head -n 1)"
          test -n "$FRPC_BIN"
          readelf -h "$FRPC_BIN" | grep -q 'AArch64'
          cp "$FRPC_BIN" app/src/main/jniLibs/arm64-v8a/libfrpc.so
          chmod 755 app/src/main/jniLibs/arm64-v8a/libfrpc.so
          sha256sum app/src/main/jniLibs/arm64-v8a/libfrpc.so

      - name: Bundle verified Android ARM64 PHP executable
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/jniLibs/arm64-v8a "$RUNNER_TEMP/php-runtime"
          curl --fail --location --retry 3 "https://github.com/pmmp/PHP-Binaries/releases/download/pm5-php-8.4-latest/PHP-8.4-Android-arm64-PM5.tar.gz" -o "$RUNNER_TEMP/php-runtime.tar.gz"
          echo "d8867966340121f821591b9bb29c80a58ad77abd6cc8e0e44d1cbbb3aaedd70c  $RUNNER_TEMP/php-runtime.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/php-runtime.tar.gz" -C "$RUNNER_TEMP/php-runtime"
          PHP_BIN="$(find "$RUNNER_TEMP/php-runtime" -type f -name php | head -n 1)"
          test -n "$PHP_BIN"
          readelf -h "$PHP_BIN" | grep -q 'AArch64'
          cp "$PHP_BIN" app/src/main/jniLibs/arm64-v8a/libphp.so
          chmod 755 app/src/main/jniLibs/arm64-v8a/libphp.so

      - name: Bundle verified Falcon Android ARM64 executable
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/assets
          BASE="https://github.com/mechy007/CRAFTNODE/releases/download/falcon-android-arm64-experimental"
          curl --fail --location --retry 3 "$BASE/FalconServer-android-arm64.sha256" -o "$RUNNER_TEMP/falcon.sha256"
          curl --fail --location --retry 3 "$BASE/FalconServer-android-arm64" -o "$RUNNER_TEMP/FalconServer"
          EXPECTED="$(awk '{print $1}' "$RUNNER_TEMP/falcon.sha256")"
          echo "$EXPECTED  $RUNNER_TEMP/FalconServer" | sha256sum --check
          readelf -h "$RUNNER_TEMP/FalconServer" | grep -q 'AArch64'
          cp "$RUNNER_TEMP/FalconServer" app/src/main/jniLibs/arm64-v8a/libfalcon.so
          chmod 755 app/src/main/jniLibs/arm64-v8a/libfalcon.so
          awk '{print $1}' "$RUNNER_TEMP/falcon.sha256" > app/src/main/assets/falcon.sha256
          test "$(wc -c < app/src/main/assets/falcon.sha256)" -eq 65

      - name: Bundle trusted CA certificates for native Falcon TLS
        shell: bash
        run: |
          set -euo pipefail
          test -s /etc/ssl/certs/ca-certificates.crt
          mkdir -p app/src/main/assets
          cp /etc/ssl/certs/ca-certificates.crt app/src/main/assets/cacert.pem
          test "$(wc -c < app/src/main/assets/cacert.pem)" -gt 100000
          sha256sum app/src/main/assets/cacert.pem

      - name: Prepare pinned NovaMine checksum asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets "$RUNNER_TEMP/novamine"
          NOVAMINE_URL="https://raw.githubusercontent.com/Zinkaio/NovaMine/e37d378d35b7ecb46ee5a6b9838a6d8261da2b24/NovaMine.phar"
          curl --fail --location --retry 3 "$NOVAMINE_URL" -o "$RUNNER_TEMP/novamine/NovaMine.phar"
          test "$(stat -c%s "$RUNNER_TEMP/novamine/NovaMine.phar")" -gt 1000000
          sha256sum "$RUNNER_TEMP/novamine/NovaMine.phar" | awk '{print $1}' > app/src/main/assets/novamine.sha256
          test "$(wc -c < app/src/main/assets/novamine.sha256)" -eq 65

      - name: Set up Rust for native Playit agent
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Check out pinned official Playit agent
        uses: actions/checkout@v4
        with:
          repository: playit-cloud/playit-agent
          ref: v1.0.12
          path: playit-agent

      - name: Bundle verified native Playit Android ARM64 agent
        shell: bash
        working-directory: playit-agent
        run: |
          set -euo pipefail
          NDK="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$NDK/aarch64-linux-android24-clang"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$NDK/aarch64-linux-android24-clang"
          export CC_aarch64_linux_android="$NDK/aarch64-linux-android24-clang"
          export AR_aarch64_linux_android="$NDK/llvm-ar"
          cargo build --locked --release --target aarch64-linux-android -p playitd --bin playitd -p playit-cli --bin playit-cli
          mkdir -p ../app/src/main/jniLibs/arm64-v8a
          DAEMON="target/aarch64-linux-android/release/playitd"
          CLI="target/aarch64-linux-android/release/playit-cli"
          test -f "$DAEMON" && test -f "$CLI"
          readelf -h "$DAEMON" | grep -q 'AArch64'
          readelf -h "$CLI" | grep -q 'AArch64'
          cp "$DAEMON" ../app/src/main/jniLibs/arm64-v8a/libplayitd.so
          cp "$CLI" ../app/src/main/jniLibs/arm64-v8a/libplayit_cli.so
          chmod 755 ../app/src/main/jniLibs/arm64-v8a/libplayitd.so ../app/src/main/jniLibs/arm64-v8a/libplayit_cli.so
          sha256sum ../app/src/main/jniLibs/arm64-v8a/libplayitd.so ../app/src/main/jniLibs/arm64-v8a/libplayit_cli.so

      - name: Run Python project safety checks
        run: python tools/validate_project.py

      - name: Run unit tests and build APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug

      - name: Rename versioned APK
        run: cp app/build/outputs/apk/debug/app-debug.apk CraftNode-v1.0.23-debug.apk

      - name: Upload CraftNode v1.0.20 APK
        uses: actions/upload-artifact@v4
        with:
          name: CraftNode-v1.0.23-debug-apk
          path: CraftNode-v1.0.23-debug.apk
          if-no-files-found: error
          retention-days: 30
