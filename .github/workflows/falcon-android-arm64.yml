name: Falcon Android ARM64 Engine Build

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/falcon-android-arm64.yml"

permissions:
  contents: write

jobs:
  build-falcon-android:
    name: Cross-compile Falcon for Android ARM64
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout CraftNode
        uses: actions/checkout@v4

      - name: Checkout pinned Falcon source
        uses: actions/checkout@v4
        with:
          repository: Falcon-MC/Falcon
          ref: v1.0.3
          path: third_party/Falcon

      - name: Patch missing Android TCP protocol header
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="third_party/Falcon/Falcon.Server/src/Core/Net/HttpsClient.cpp"
          # Falcon v1.0.3 uses IPPROTO_TCP but omits its declaring header on
          # Android's NDK libc headers. Add the standard POSIX header only if absent.
          python3 - "$SOURCE" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          source = path.read_text()
          include = "#include <netinet/in.h>"
          if include not in source:
              marker = "#include <netdb.h>"
              if marker not in source:
                  raise SystemExit("Could not find netdb include in HttpsClient.cpp")
              source = source.replace(marker, marker + chr(10) + include, 1)
              path.write_text(source)
          if include not in path.read_text():
              raise SystemExit("Failed to apply Android TCP header patch")
          PY

      - name: Show Falcon build configuration
        shell: bash
        run: |
          set -euo pipefail
          echo "Pinned Falcon source:"
          git -C third_party/Falcon log -1 --oneline
          echo "Submodules and dependency declarations:"
          git -C third_party/Falcon submodule status || true
          grep -R -n -E "FetchContent|ExternalProject|EncodingSettings|NBT" third_party/Falcon/CMakeLists.txt third_party/Falcon/cmake third_party/Falcon 2>/dev/null | head -n 100 || true

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake git curl zip unzip tar pkg-config

      - name: Install Android SDK and pinned NDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          # sdkmanager may close stdin after accepting all licenses; with pipefail,
          # yes then exits via SIGPIPE and incorrectly fails this step.
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" --install "ndk;27.2.12479018"
          test -f "$ANDROID_HOME/ndk/27.2.12479018/build/cmake/android.toolchain.cmake"

      - name: Bootstrap vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Build Android dependencies
        run: |
          "$VCPKG_ROOT/vcpkg" install openssl:arm64-android zlib:arm64-android

      - name: Configure Falcon with Android NDK
        env:
          FALCON_BUILD_VERSION: "1.26.52.01"
        run: |
          set -euo pipefail
          cmake -S third_party/Falcon -B build-falcon-android -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=arm64-android \
            -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DOPENSSL_USE_STATIC_LIBS=ON \
            -DOPENSSL_ROOT_DIR="$VCPKG_ROOT/installed/arm64-android" \
            -DZLIB_USE_STATIC_LIBS=ON \
            -DFALCON_BUILD_VERSION="$FALCON_BUILD_VERSION"

      - name: Raise Falcon NBT byte-array limits for Bedrock login packets
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          roots = [Path("third_party/Falcon"), Path("build-falcon-android")]
          headers = [p for root in roots if root.exists() for p in root.rglob("EncodingSettings.h")]
          sources = [p for root in roots if root.exists() for p in root.rglob("EncodingSettings.cpp")]
          if not headers or not sources:
              raise SystemExit("Could not locate Falcon NBT EncodingSettings.h/.cpp after CMake configure")

          header_changes = 0
          for path in headers:
              original = path.read_text()
              updated = original.replace("mMaxByteArraySize(1024 * 1024)", "mMaxByteArraySize(2 * 1024 * 1024)")
              if updated != original:
                  path.write_text(updated)
                  header_changes += 1

          source_changes = 0
          for path in sources:
              original = path.read_text()
              updated = original.replace("server.mMaxByteArraySize = 1024 * 512;", "server.mMaxByteArraySize = 2 * 1024 * 1024;")
              if updated != original:
                  path.write_text(updated)
                  source_changes += 1

          if header_changes == 0 and source_changes == 0:
              combined = "\\n".join(p.read_text() for p in headers + sources)
              if "mMaxByteArraySize(2 * 1024 * 1024)" not in combined and "server.mMaxByteArraySize = 2 * 1024 * 1024;" not in combined:
                  raise SystemExit("NBT byte-array limit patch did not apply; refusing to build an unpatched engine")
          print(f"Patched NBT byte-array limit to 2 MiB (headers changed: {header_changes}, sources changed: {source_changes})")
          PY
          grep -R -n "mMaxByteArraySize.*2 \* 1024 \* 1024" third_party/Falcon build-falcon-android

      - name: Build patched Falcon
        run: cmake --build build-falcon-android --parallel 2

      - name: Verify Android ARM64 binary
        run: |
          set -euo pipefail
          BIN="build-falcon-android/Falcon.Server/FalconServer"
          test -f "$BIN"
          file "$BIN"
          readelf -h "$BIN" | grep -q "AArch64"
          mkdir -p dist
          cp "$BIN" dist/FalconServer-android-arm64
          sha256sum dist/FalconServer-android-arm64 > dist/FalconServer-android-arm64.sha256
          printf 'Target: Minecraft Bedrock 1.26.52\nProtocol: 2193\nArchitecture: Android ARM64\nBuild source: Falcon v1.0.3\n' > dist/BUILD_INFO.txt

      - name: Upload experimental engine artifact
        uses: actions/upload-artifact@v4
        with:
          name: Falcon-1.26.52-android-arm64-experimental
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish experimental Android engine release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: falcon-android-arm64-experimental
          name: Falcon Android ARM64 Experimental
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: |
            dist/FalconServer-android-arm64
            dist/FalconServer-android-arm64.sha256
            dist/BUILD_INFO.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
